<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/jpeg" href="/neorth-logo.jpg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NEORTH — Build Wealth Daily | Real-Life Goals &amp; Community Leaderboards</title>
  <meta name="description"
    content="Consistent wealth building daily. Sync bank accounts via RBI Account Aggregator, track real-life goals by target age, and compete in healthy inner-circle leaderboards based on % completed." />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neorth: {
              deep: '#030b07',
              main: '#06150e',
              card: 'rgba(9, 32, 22, 0.75)',
              emerald: '#10b981',
              mint: '#00ff9d',
              gold: '#f59e0b',
              goldlight: '#fef08a',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'Outfit', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          }
        }
      }
    }
  </script>
</head>

<body>
  <!-- Hidden Netlify Forms definition for React/Vite SPA deployment -->
  <form name="waitlist" data-netlify="true" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="waitlist" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="targetGoal">
      <option value="₹50 Lakhs">₹50 Lakhs</option>
      <option value="₹1 Crore by 2030">₹1 Crore by 2030</option>
      <option value="₹5 Crores">₹5 Crores</option>
      <option value="₹10 Crores+">₹10 Crores+</option>
    </select>
    <input type="text" name="bot-field" />
  </form>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
